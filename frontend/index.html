<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCook — Gợi ý món theo nguyên liệu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body data-page="index">
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">SmartCook</div>
      <div class="sidebar-sub">AI Meal Planner</div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item nav-item-active" href="index.html"><span class="dot"></span>Trang chủ</a>
      <a class="nav-item" href="scan.html"><span class="dot"></span>Quét ảnh (AI)</a>
      <a class="nav-item" href="reviews.html"><span class="dot"></span>Đánh giá món</a>
      <a class="nav-item" href="pantry.html"><span class="dot"></span>Tủ lạnh</a>
      <a class="nav-item" href="favorites.html"><span class="dot"></span>Món yêu thích</a>
      <a class="nav-item" href="history.html"><span class="dot"></span>Lịch sử</a>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-settings"><span>⚙</span> Cài đặt</button>
      <button class="sidebar-user-row">
        <span class="sidebar-user-avatar"></span>
        <span>Đăng nhập</span>
      </button>
    </div>
  </aside>

  <!-- APP -->
  <div class="app">

    <!-- HEADER -->
    <header class="topbar">
      <div class="topbar-left">
        <p class="eyebrow">HÔM NAY BẠN CÓ GÌ?</p>
        <h1 class="page-title">Nhập nguyên liệu, AI gợi ý món ngay.</h1>
        <p class="page-sub">
          Gõ nhanh nguyên liệu đang có trong tủ lạnh, hoặc quét ảnh thực phẩm.
          SmartCook sẽ gợi ý món ngon phù hợp khẩu vị và thời gian của bạn.
        </p>
      </div>

      <div class="topbar-right">
        <div class="topbar-actions">
          <button id="btnClear" class="btn btn-ghost">Làm mới</button>
          <button id="btnGenerate" class="btn btn-primary">Gợi ý món ngay</button>
        </div>

        <!-- HERO IMAGE -->
        <div class="hero-illustration">
          <img src="./assets/hero.jpg" alt="Món ăn hấp dẫn" />
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="grid content-grid">
      <section class="card hero-card">
        <div class="hero-header">
          <div class="hero-label">Nguyên liệu</div>
          <textarea
            id="ingredientsText"
            class="textarea hero-input"
            rows="3"
            placeholder="Ví dụ: Trứng, Cà chua, Thịt bò..."
          ></textarea>
        </div>
      </section>
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
