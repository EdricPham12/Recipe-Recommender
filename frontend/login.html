<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCook — Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <div class="card auth-card">
        <div class="auth-brand">SmartCook</div>
        <div class="auth-sub">Đăng nhập để lưu lịch sử và món yêu thích.</div>
        <form id="loginForm" class="form-grid" autocomplete="on">
          <div class="full">
            <label class="label">Email</label>
            <input id="loginEmail" type="email" class="input" placeholder="name@email.com" required />
          </div>
          <div class="full">
            <label class="label">Mật khẩu</label>
            <input id="loginPassword" type="password" class="input" placeholder="••••••••" required />
          </div>
          <div class="full row-actions">
            <div class="actions">
              <button class="btn btn-primary" type="submit">Đăng nhập</button>
              <a class="btn btn-secondary" href="register.html">Đăng ký</a>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="./login.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
