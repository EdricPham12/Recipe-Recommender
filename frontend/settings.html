<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCook — Cài đặt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/settings.css" />
  </head>
  <body data-page="settings">
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-logo">SmartCook</div>
          <div class="sidebar-sub">AI Meal Planner</div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="home.html">
            <span class="dot"></span>
            <span class="icon">🏠</span>
            Trang chủ
          </a>
          <a class="nav-item" href="scan.html">
            <span class="dot"></span>
            <span class="icon">📷</span>
            Quét ảnh (AI)
          </a>
          <a class="nav-item" href="reviews.html">
            <span class="dot"></span>
            <span class="icon">⭐</span>
            Đánh giá món
          </a>
          <a class="nav-item" href="pantry.html">
            <span class="dot"></span>
            <span class="icon">🧊</span>
            Tủ lạnh
          </a>
          <a class="nav-item" href="favorites.html">
            <span class="dot"></span>
            <span class="icon">❤️</span>
            Món yêu thích
          </a>
          <a class="nav-item" href="history.html">
            <span class="dot"></span>
            <span class="icon">🕘</span>
            Lịch sử
          </a>
        </nav>
        <div class="sidebar-footer">
          <button class="sidebar-settings" type="button" id="btnSettingsNav">
            <span class="sidebar-settings-icon">⚙</span>
            <span class="sidebar-settings-text">Cài đặt</span>
          </button>
          <button class="sidebar-user-row" type="button" id="btnProfileNav">
            <span class="sidebar-user-avatar"></span>
            <span class="sidebar-user-name">Đăng nhập</span>
          </button>
        </div>
      </aside>

      <div class="app">
        <header class="topbar">
          <div class="topbar-left">
            <p class="eyebrow">Cài đặt SmartCook</p>
            <h1 class="page-title">Quản lý tài khoản và bảo mật.</h1>
            <p class="page-sub">Các thay đổi sẽ được lưu trên trình duyệt hiện tại.</p>
          </div>
        </header>

        <main class="grid">
          <section class="card profile-card">
            <div class="profile-head">
              <div>
                <h2>Tài khoản</h2>
                <p class="page-sub">Cập nhật thông tin cá nhân.</p>
              </div>
            </div>
            <div class="profile-body">
              <div class="avatar-block">
                <div id="profileAvatar" class="avatar-preview">SC</div>
                <label class="label">Ảnh đại diện</label>
                <input id="avatarFile" type="file" class="input input-sm" accept="image/*" />
                <div class="avatar-actions">
                  <button id="btnRemoveAvatar" class="btn btn-ghost" type="button">Xóa ảnh</button>
                </div>
                <div class="hint">Ảnh lưu tại trình duyệt hiện tại.</div>
              </div>
              <div class="profile-fields">
                <label class="label">Họ và tên</label>
                <input id="profileName" class="input input-sm" />
                <label class="label">Tên đăng nhập</label>
                <input id="profileUsername" class="input input-sm" />
                <label class="label">Email</label>
                <input id="profileEmail" class="input input-sm" />
                <label class="label">Số điện thoại</label>
                <input id="profilePhone" class="input input-sm" placeholder="09xx xxx xxx" />
                <div class="profile-actions">
                  <button id="btnSaveProfile" class="btn btn-secondary" type="button">
                    <span class="icon">💾</span>Lưu thay đổi
                  </button>
                  <button id="btnFakeLogout" class="btn btn-ghost" type="button">
                    <span class="icon">🚪</span>Đăng xuất
                  </button>
                </div>
                <div id="profileStatus" class="status"></div>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>Bảo mật</h2>
            <div class="form-grid">
              <div>
                <label class="label">Mật khẩu hiện tại</label>
                <input id="currentPassword" type="password" class="input input-sm" placeholder="••••••••" />
              </div>
              <div>
                <label class="label">Mật khẩu mới</label>
                <input id="newPassword" type="password" class="input input-sm" placeholder="••••••••" />
              </div>
              <div>
                <label class="label">Xác nhận mật khẩu mới</label>
                <input id="confirmPassword" type="password" class="input input-sm" placeholder="••••••••" />
              </div>
              <div class="full row-actions">
                <button id="btnChangePassword" class="btn btn-secondary" type="button">Đổi mật khẩu</button>
                <span id="passwordStatus" class="status"></span>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="./js/settings.js"></script>
  </body>
</html>
