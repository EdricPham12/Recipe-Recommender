<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCook — Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesqu…00;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/register.css" />
  </head>
  <body data-page="register">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand">SmartCook</div>
          <p class="auth-sub">Tạo tài khoản để lưu lịch sử và món yêu thích.</p>
        </div>

        <form id="registerForm" class="form-grid" autocomplete="on">
          <div>
            <label class="label">Họ và tên</label>
            <div class="input-wrap">
              <span class="input-icon">🧑</span>
              <input id="registerName" class="input" placeholder="Ví dụ: Nguyễn Văn A" required />
            </div>
          </div>
          <div>
            <label class="label">Tên đăng nhập</label>
            <div class="input-wrap">
              <span class="input-icon">🏷️</span>
              <input id="registerUsername" class="input" placeholder="username" required />
            </div>
          </div>
          <div>
            <label class="label">Số điện thoại</label>
            <div class="input-wrap">
              <span class="input-icon">📱</span>
              <input id="registerPhone" class="input" placeholder="Ví dụ: 09xx xxx xxx" />
            </div>
          </div>
          <div class="full">
            <label class="label">Email</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input id="registerEmail" type="email" class="input" placeholder="name@email.com" required />
            </div>
          </div>
          <div>
            <label class="label">Mật khẩu</label>
            <div class="password-field">
              <span class="input-icon">🔒</span>
              <input id="registerPassword" type="password" class="input" placeholder="••••••••" required />
              <button class="eye-btn" type="button" aria-label="Hiện mật khẩu" data-eye="registerPassword">👁</button>
            </div>
            <div class="auth-hint">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
          </div>
          <div>
            <label class="label">Xác nhận mật khẩu</label>
            <div class="password-field">
              <span class="input-icon">🔒</span>
<input id="registerConfirm" type="password" class="input" placeholder="••••••••" required />
              <button class="eye-btn" type="button" aria-label="Hiện mật khẩu" data-eye="registerConfirm">👁</button>
            </div>
          </div>

          <div class="full row-actions">
            <label class="check"><input id="acceptTerms" type="checkbox" />Đồng ý điều khoản</label>
          </div>
          <div class="full row-actions">
            <button class="btn btn-primary" type="submit">Đăng ký</button>
            <a class="btn btn-ghost" href="login.html">Đã có tài khoản</a>
          </div>
          <div id="authMessage" class="status"></div>
        </form>
      </div>
    </div>

    <script src="./js/register.js"></script>
  </body>
</html>
