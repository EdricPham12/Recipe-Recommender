<!doctype html>
<html lang="vi">
  <head>

        <nav class="sidebar-nav">

          <a class="nav-item" href="scan.html">

            <span class="icon">📷</span>

          <a class="nav-item" href="reviews.html">
            <span class="dot"></span>

          </a>
          <a class="nav-item" href="pantry.html">
            <span class="dot"></span>
            <span class="icon">🧊</span>
